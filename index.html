<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louvre Digital</title>
    <meta
      name="description"
      content="Galeria de arte interactiva con obras clasicas, filtros por movimiento artistico y visor ampliado."
    />
    <!--Bootstrap/css-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <!--css/style.css-->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__content">
        <div class="hero__copy">
          <p class="eyebrow">Museo Virtual</p>
          <h1 class="hero__title">Louvre Digital</h1>
          <p class="hero__text">Explora una selección de obras icónicas.</p>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="gallery-section" aria-labelledby="gallery-title">
        <h2 id="gallery-title" class="sr-only">Galería de obras</h2>
        <div id="empty-state" class="empty-state" hidden>
          No se encontraron obras con los filtros actuales.
        </div>
        <div id="gallery" class="gallery"></div>
      </section>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <div id="lightbox-backdrop" class="lightbox__backdrop"></div>
      <div class="lightbox__dialog">
        <button
          id="lightbox-close"
          class="lightbox__close"
          type="button"
          aria-label="Cerrar imagen"
        >
          ×
        </button>
        <img id="lightbox-image" class="lightbox__image" src="" alt="" />
      </div>
    </div>

    <footer class="footer">
      <div class="footer__line"></div>
      <p class="footer__copy">
        Realizado por Osvaldo Ramirez © <span id="year"></span>
      </p>
      <button id="btn-top" type="button" class="button">Volver arriba</button>
    </footer>

    <!-- Scripts -->

    <!--jQuery-->
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>

    <!--Bootstrap/popper-->
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>

    <!--Bootstrap/js-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>

    <!-- js/script.js -->
    <script src="js/main.js" type="text/javascript"></script>
  </body>
</html>
